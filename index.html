function showShopping(k){let el=document.getElementById('shopping');if(!el)return;if(!k||!state.weeks[k]?.approved){el.innerHTML='<p class="notice">Aprobá un menú desde Semana para generar su lista.</p>';return}let days=state.weeks[k].days,items={};Object.entries(days).forEach(([date,meals])=>{let d=new Date(date+'T12:00:00');mealParts(d,meals).forEach(({name:n,j})=>{if(!n||!R[n])return;for(let [ing,q] of R[n][0]){(items[ing]??=[]).push(`${q} × ${portionsFor(j)} (${MEALS[j]}: ${n})`)}})});el.innerHTML=`<p class="muted">Agrupá los ingredientes repetidos al comprar. Las cantidades se multiplican según los comensales de cada comida.</p><div class="card">${Object.entries(items).sort().map(([ing,vals])=>`<label style="display:block;margin:10px 0"><input type="checkbox"> <b>${escapeHTML(ing)}</b><div class="muted">${vals.map(escapeHTML).join('; ')}</div></label>`).join('')}</div><button class="action" onclick="copyShopping('${k}')">Copiar lista</button>`}
function copyShopping(k){let items={};Object.entries(state.weeks[k].days).forEach(([date,meals])=>{let d=new Date(date+'T12:00:00');mealParts(d,meals).forEach(({name:n,j})=>{if(R[n])R[n][0].forEach(([ing,q])=>(items[ing]??=[]).push(`${q} × ${portionsFor(j)} (${MEALS[j]})`))})});let t=Object.entries(items).sort().map(([n,v])=>`${n}: ${v.join(' + ')}`).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('Lista copiada')).catch(()=>prompt('Copiá la lista:',t))}
function move(n){weekOffset+=n;render()}function openWeek(i){weekOffset=i;tab('Semana')}function approve(){let w=getWeek(add(start(new Date()),weekOffset*7));if(!w.approved){let issues=[];for(const [day,arr] of Object.entries(w.days))for(const j of [1,3])if(arr[j]){let dup=duplicates(w.days,day,j,arr[j]);if(dup.length)issues.push(`${day}: ${dup[0]}`)}if(issues.length){alert('Hay repeticiones en el menú. Cambiá los platos señalados antes de aprobar:\n'+[...new Set(issues)].slice(0,12).join('\n'));return}}w.approved=!w.approved;save();render()}function regen(){let k=iso(add(start(new Date()),weekOffset*7));if(!confirm('¿Reemplazar la propuesta de esta semana?'))return;state.weeks[k]=generate(k);let d=state.weeks[k].days;for(let [date,arr] of Object.entries(d)){let day=new Date(date+'T12:00:00').getDay();if(day===6)arr[1]='Asado';if(day===0)arr[1]='Pastas del domingo';if(day===6||day===0)arr[3]=null}save();render()}function setPortions(which,n){if(!['lunchPortions','dinnerPortions','otherPortions'].includes(which))return;state[which]=Math.min(20,Math.max(1,Number(n)||2));save();render()}function backup(){let b=new Blob([JSON.stringify({portions:state.otherPortions,lunchPortions:state.lunchPortions,dinnerPortions:state.dinnerPortions,otherPortions:state.otherPortions,weeks:state.weeks},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='mi-cocina-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
