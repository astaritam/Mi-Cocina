<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#28765d"><title>Mi Cocina</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#21372e;font:16px system-ui,Arial}header{background:#28765d;color:white;padding:22px 18px}header h1{margin:0;font-size:27px}header p{margin:5px 0 0}nav{display:flex;overflow:auto;background:white;position:sticky;top:0;box-shadow:0 2px 7px #0001}nav button{border:0;background:none;padding:16px 14px;color:#456;font-weight:650;white-space:nowrap}nav button.active{color:#176a4d;border-bottom:3px solid #176a4d}main{max-width:760px;margin:auto;padding:18px 15px 70px}h2{margin:5px 0 16px}h3{margin:12px 0}.card{background:white;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #152e2010}.muted{color:#647369;font-size:14px}.meal{border-top:1px solid #e5e9e5;padding:13px 0}.meal:first-of-type{border:0}.meal strong{display:block;color:#247257}.meal p{margin:6px 0}button.action{background:#28765d;color:white;border:0;border-radius:9px;padding:10px 14px;margin:5px 5px 5px 0;font-size:14px}button.secondary{background:#e5f1e9;color:#245b43}button.danger{background:#fbe9e7;color:#943d32}select,input{padding:10px;border:1px solid #cad7ce;border-radius:8px;font-size:16px;max-width:100%}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;background:#e6f2e9;padding:5px 9px;border-radius:20px;font-size:13px;margin:3px}details{background:#f4f8f4;border-radius:9px;padding:10px;margin-top:8px}summary{cursor:pointer;font-weight:600;color:#24634b}li{margin:7px 0}.notice{background:#fff4da;padding:12px;border-radius:9px}.ok{background:#e4f5e8;padding:12px;border-radius:9px}footer{color:#77877e;text-align:center;font-size:12px;margin:30px}</style></head><body><header><h1>🍲 Mi Cocina</h1><p>Tu menú casero, variado y organizado</p></header><nav id="nav"></nav><main id="app"></main><footer>Los datos se guardan en este navegador. Guardá una copia de tus menús si cambiás de teléfono.</footer><script>

 'Budín casero de zanahoria':[[['Zanahoria','1 unidad'],['Huevo','1 unidad'],['Harina integral','60 g'],['Aceite','1 cucharada'],['Polvo de hornear','1 cucharadita']],['Rallar la zanahoria y mezclar los ingredientes.','Colocar en molde pequeño.','Hornear a 180 °C unos 25–35 minutos; comprobar con palillo.']],

 'Arroz integral con garbanzos':[[['Arroz integral seco','70 g'],['Garbanzos cocidos','120 g'],['Zanahoria','1/2 unidad'],['Cebolla','1/2 unidad']],['Cocinar el arroz según el envase.','Saltear las verduras y agregar garbanzos.','Mezclar con el arroz.']],
 'Berenjenas rellenas':[[['Berenjena','1 unidad'],['Tomate','1 unidad'],['Ajo','1 diente'],['Queso fresco','40 g']],['Cortar berenjena al medio y hornear a 190 °C hasta tierna.','Retirar parte de la pulpa y mezclar con tomate y ajo.','Rellenar, agregar queso y gratinar 10 minutos.']],
 'Ensalada de remolacha y huevo':[[['Remolacha','1 unidad'],['Huevos','2 unidades'],['Lechuga','60 g'],['Aceite de oliva','1 cucharada']],['Hervir o asar la remolacha hasta tierna.','Cocer los huevos 10 minutos.','Mezclar con lechuga y aceite.']],
 'Carne con puré mixto':[[['Carne magra','180 g'],['Papa','150 g'],['Zanahoria','150 g'],['Aceite de oliva','1 cucharadita']],['Hervir papa y zanahoria hasta tiernas y pisar.','Cocinar la carne al punto seguro deseado y servir.']],
 'Sopa de verduras y queso':[[['Calabaza','180 g'],['Zanahoria','1 unidad'],['Cebolla','1/2 unidad'],['Queso fresco','40 g']],['Cocinar las verduras en agua hasta tiernas.','Procesar, ajustar condimentos y agregar queso al servir.']],
 'Asado':[[['Carne para asado','300 g'],['Ensalada de hojas','100 g'],['Tomate','1 unidad']],['Preparar las brasas y cocinar la carne hasta el punto seguro.','Lavar y cortar las verduras para acompañar.']],
 'Pastas del domingo':[[['Pasta seca','100 g'],['Tomate triturado','150 g'],['Ajo','1 diente'],['Aceite de oliva','1 cucharadita']],['Hervir la pasta según el envase.','Cocinar tomate con ajo y aceite unos 15–20 minutos.','Mezclar y servir.']],
 'Omelette con champiñones':[[['Huevos','2 unidades'],['Champiñones','120 g'],['Aceite de oliva','1 cucharadita']],['Saltear los champiñones.','Agregar huevos batidos y cocinar hasta cuajar.']],
 'Pescado con batatas':[[['Pescado','180 g'],['Batata','220 g'],['Limón','1/2 unidad']],['Hornear la batata cortada a 190 °C durante 25–35 minutos.','Agregar pescado y hornear hasta cocido.']],
 'Ensalada de pollo y lechuga':[[['Pollo','160 g'],['Lechuga','100 g'],['Tomate','1 unidad'],['Aceite de oliva','1 cucharada']],['Cocinar bien el pollo y dejar entibiar.','Cortar y mezclar con verduras lavadas y aceite.']],
 'Coliflor gratinada':[[['Coliflor','220 g'],['Queso fresco','50 g'],['Leche','50 ml']],['Cocinar coliflor al vapor hasta tierna.','Pasar a fuente, agregar leche y queso.','Gratinar 10–15 minutos.']],
 'Hamburguesas de lentejas':[[['Lentejas cocidas','150 g'],['Huevo','1 unidad'],['Cebolla','1/2 unidad'],['Pan rallado','20 g']],['Pisar las lentejas y mezclar con cebolla salteada, huevo y pan rallado.','Formar hamburguesas.','Hornear a 190 °C unos 20–25 minutos, girando a mitad.']]
};

Object.assign(R,{
 'Salmón con costra de pistachos':[[['Salmón','180 g'],['Pistachos','25 g'],['Mostaza','1 cucharadita'],['Miel','1 cucharadita'],['Batata','200 g']],['Untar el salmón con mostaza y miel y cubrir con pistachos picados.','Hornear a 190 °C durante 12–18 minutos, según grosor.','Servir con batata asada.']],
 'Trucha al limón con papas aplastadas':[[['Trucha','180 g'],['Papa','220 g'],['Limón','1/2 unidad'],['Perejil','1 cucharada']],['Hervir las papas, aplastarlas y dorarlas al horno con aceite.','Cocinar la trucha con limón hasta que esté lista.','Servir con perejil.']],
 'Tacos de atún con palta':[[['Atún fresco','160 g'],['Tortillas','2 unidades'],['Palta','1/2 unidad'],['Repollo','80 g'],['Limón','1/2 unidad']],['Cocinar el atún hasta el punto seguro.','Cortar el repollo y la palta.','Armar tacos con limón.']],
 'Cerdo a la mostaza con calabaza':[[['Cerdo','180 g'],['Mostaza','1 cucharada'],['Calabaza','220 g'],['Cebolla','1/2 unidad']],['Cortar la calabaza y cebolla y hornear con aceite.','Dorar el cerdo y terminar su cocción con mostaza.','Servir junto a las verduras.']],
 'Pollo al limón con verduras':[[['Pollo','180 g'],['Limón','1/2 unidad'],['Zanahoria','1 unidad'],['Zucchini','1 unidad']],['Condimentar el pollo con limón.','Hornear con zanahoria y zucchini hasta cocción completa.']],
 'Milanesas de carne con ensalada de remolacha':[[['Carne para milanesas','180 g'],['Huevo','1 unidad'],['Pan rallado','60 g'],['Remolacha','1 unidad'],['Rúcula','50 g']],['Empanar la carne con huevo y pan rallado y cocinar bien.','Hervir o asar la remolacha y combinar con rúcula.']],
 'Milanesas de carne con puré de papas':[[['Carne para milanesas','180 g'],['Huevo','1 unidad'],['Pan rallado','60 g'],['Papa','220 g']],['Empanar y cocinar las milanesas.','Hervir las papas y preparar puré.']],
 'Ñoquis de calabaza con salsa de tomate':[[['Calabaza','250 g'],['Harina','90 g'],['Huevo','1/2 unidad'],['Tomate triturado','150 g']],['Asar la calabaza y hacer puré seco.','Mezclar con huevo y harina, formar ñoquis y hervir hasta que suban.','Servir con salsa de tomate cocida.']],
 'Ravioles de ricota y espinaca':[[['Ravioles de ricota y espinaca','200 g'],['Tomate triturado','150 g'],['Queso rallado','20 g']],['Hervir los ravioles según el envase.','Calentar el tomate y servir con queso.']],
 'Pizza casera de mozzarella y vegetales':[[['Harina','130 g'],['Levadura seca','2 g'],['Mozzarella','90 g'],['Tomate triturado','70 g'],['Morrón','1/2 unidad']],['Amasar harina con agua, levadura y sal y dejar levar.','Estirar, precocinar, cubrir con salsa, queso y morrón.','Hornear hasta dorar.']],
 'Empanadas caseras de carne':[[['Tapas de empanada','3 unidades'],['Carne picada','150 g'],['Cebolla','1/2 unidad'],['Huevo duro','1/2 unidad']],['Saltear cebolla y carne hasta cocinar.','Agregar huevo duro, rellenar tapas y cerrar.','Hornear a 200 °C hasta dorar.']],
 'Tarta de champiñones y cebolla':[[['Masa de tarta','1/3 unidad'],['Champiñones','150 g'],['Cebolla','1/2 unidad'],['Huevo','1 unidad'],['Queso','50 g']],['Saltear cebolla y champiñones.','Mezclar con huevo y queso, rellenar la masa.','Hornear hasta cuajar.']]
});
const B=['Tostadas con palta','Pan integral con ricota y fruta','Pan con huevo revuelto','Tostadas con queso y tomate','Budín casero de zanahoria','Yogur con fruta y nueces','Fruta y puñado de almendras'];
const L=['Ensalada de lentejas y verduras','Pollo con calabaza al horno','Arroz integral con garbanzos','Merluza al horno con brócoli','Ensalada de remolacha y huevo','Carne con puré mixto','Asado'];
const D=['Pollo con calabaza al horno','Pescado con batatas','Carne con puré mixto','Arroz integral con garbanzos','Merluza al horno con brócoli','Hamburguesas de lentejas','Berenjenas rellenas'];
const ALT=['Ensalada de pollo y lechuga','Carne con puré mixto','Ensalada de lentejas y verduras','Pollo con calabaza al horno','Merluza al horno con brócoli','Arroz integral con garbanzos','Berenjenas rellenas'];
const key='mi-cocina-v4';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}};state.lunchPortions=state.lunchPortions||2;state.dinnerPortions=state.dinnerPortions||3;state.otherPortions=state.otherPortions||state.portions||2;state.weeks=state.weeks||{};if(!state.menuRulesV5){for(const k of Object.keys(state.weeks)){if(!state.weeks[k].approved)delete state.weeks[k]}state.menuRulesV5=true;}state.tab='Hoy';let weekOffset=0;const save=()=>localStorage.setItem(key,JSON.stringify({portions:state.otherPortions,lunchPortions:state.lunchPortions,dinnerPortions:state.dinnerPortions,otherPortions:state.otherPortions,weeks:state.weeks,menuRulesV5:state.menuRulesV5}));const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const start=d=>{let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const label=d=>d.toLocaleDateString('es-AR',{day:'numeric',month:'long'});const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function portionsFor(j){return j===1?state.lunchPortions:j===3?state.dinnerPortions:state.otherPortions}function generate(w){let monday=new Date(w+'T12:00:00');let idx=Math.round((monday-new Date('2026-10-05T12:00:00'))/604800000);let shift=((idx%7)+7)%7;let data={};let fish=['Merluza al horno con brócoli','Salmón con costra de pistachos','Trucha al limón con papas aplastadas','Tacos de atún con palta'];let first=fish[((idx%4)+4)%4],second=fish[(((idx+1)%4)+4)%4];let dinners=['Berenjenas rellenas',first,'Milanesas de carne con '+(idx%2===0?'puré de papas':'ensalada de remolacha'),idx%2===0?'Ñoquis de calabaza con salsa de tomate':'Ravioles de ricota y espinaca',idx%2===0?'Pollo al limón con verduras':'Cerdo a la mostaza con calabaza',idx%2===0?'Pizza casera de mozzarella y vegetales':'Empanadas caseras de carne',idx%2===0?second:'Tarta de champiñones y cebolla'];for(let i=0;i<7;i++){let day=add(monday,i),dow=day.getDay();let lunch=dow===6?'Asado':dow===0?'Pastas del domingo':L[(i+shift)%L.length];data[iso(day)]=[B[(i+shift)%B.length],lunch,B[(i+shift+3)%B.length],dinners[i]];}return {approved:false,days:data}};
function getWeek(d){let k=iso(start(d));if(!state.weeks[k]){state.weeks[k]=generate(k);save()}return state.weeks[k]};function getMeals(d){return getWeek(d).days[iso(d)]};
function recipe(name,j=null){let [ings,steps]=R[name]||[[],[]];return `<details><summary>Ver receta completa</summary><p class="muted">Cantidades orientativas por persona. Ajustar a gusto.</p><b>Ingredientes</b><ul>${ings.map(([n,q])=>`<li>${escapeHTML(n)}: ${escapeHTML(q)}</li>`).join('')}</ul><b>Preparación</b><ol>${steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><p class="muted">Para ${j===null?'la cantidad de comensales de esa comida':portionsFor(j)+' personas'}, multiplicá las cantidades por ${j===null?'la cantidad correspondiente':portionsFor(j)}. No se incluyen videos sin enlaces verificados.</p></details>`}
function cardDay(d,edit=false){let meals=getMeals(d);return `<section class="card"><h3>${DAYS[d.getDay()]} ${label(d)}</h3>${MEALS.map((m,j)=>`<div class="meal"><strong>${m}</strong><p>${j===0?'☕ Café con leche + ':''}${escapeHTML(meals[j])}</p><span class="pill">${portionsFor(j)} personas</span>${recipe(meals[j],j)}${edit&&!(d.getDay()===6&&j===1)&&!(d.getDay()===0&&j===1)?`<button class="action secondary" onclick="changeMeal('${iso(d)}',${j})">Cambiar plato</button>`:''}</div>`).join('')}</section>`}
function changeMeal(day,j){let w=getWeek(new Date(day+'T12:00:00'));if(w.approved){alert('Para editar, primero reabrí el menú semanal.');return}let options=[...new Set(j===0||j===2?B:j===1?[...L,...ALT,...D]:[...D,...L,...ALT])];let current=w.days[day][j];let s=prompt('Escribí el número de la opción:\n'+options.map((x,i)=>`${i+1}. ${x}`).join('\n'),String(Math.max(1,options.indexOf(current)+1)));if(s===null)return;let n=Number(s);if(!Number.isInteger(n)||n<1||n>options.length){alert('Opción no válida');return}w.days[day][j]=options[n-1];save();render()}
function nav(){document.getElementById('nav').innerHTML=['Hoy','Semana','Mes','Recetas','Compras','Preferencias'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="tab('${t}')">${t}</button>`).join('')};function tab(t){state.tab=t;render()}
function render(){nav();let a=document.getElementById('app'),today=new Date(),mon=add(start(today),weekOffset*7),w=getWeek(mon);if(state.tab==='Hoy'){a.innerHTML=`<h2>Hoy · ${label(today)}</h2>${cardDay(today)}<button class="action" onclick="tab('Semana')">Ver semana y aprobar menú</button>`}else if(state.tab==='Semana'){a.innerHTML=`<h2>Menú semanal</h2><div class="row"><button class="action secondary" onclick="move(-1)">← Anterior</button><b>${label(mon)} – ${label(add(mon,6))}</b><button class="action secondary" onclick="move(1)">Siguiente →</button></div><p class="${w.approved?'ok':'notice'}">${w.approved?'✓ Menú aprobado. Ya podés consultar la lista de compras.':'Revisá las recetas y cambiá los platos que quieras antes de aprobar.'}</p>${Array.from({length:7},(_,i)=>cardDay(add(mon,i),true)).join('')}<button class="action ${w.approved?'danger':''}" onclick="approve()">${w.approved?'Reabrir menú para editar':'Aprobar menú semanal'}</button><button class="action secondary" onclick="regen()">Generar otra propuesta</button>`}else if(state.tab==='Mes'){let base=start(today);a.innerHTML=`<h2>Plan de las próximas 5 semanas</h2><p class="muted">Primero se organizan las cenas familiares; las propuestas rotan entre semanas. Los almuerzos del sábado y domingo se mantienen fijos.</p>${Array.from({length:5},(_,i)=>{let d=add(base,i*7),v=getWeek(d);return `<section class="card"><h3>Semana ${i+1}: ${label(d)} – ${label(add(d,6))}</h3><p>${v.approved?'✓ Aprobada':'Pendiente de aprobación'}</p><button class="action secondary" onclick="openWeek(${i})">Ver y editar semana</button></section>`}).join('')}`}else if(state.tab==='Recetas'){a.innerHTML=`<h2>Recetario</h2><p class="muted">Consultá ingredientes y pasos antes de elegir un plato.</p>${Object.keys(R).sort().map(n=>`<div class="card"><b>${escapeHTML(n)}</b>${recipe(n)}</div>`).join('')}`}else if(state.tab==='Compras'){let chosen=Object.entries(state.weeks).filter(([k,v])=>v.approved).sort((a,b)=>a[0].localeCompare(b[0]));let current=iso(mon);a.innerHTML=`<h2>Lista de compras</h2><p>Almuerzos para <b>${state.lunchPortions}</b>, cenas para <b>${state.dinnerPortions}</b> y desayunos/meriendas para <b>${state.otherPortions}</b>. Cantidades por plato y comida.</p><div class="row"><label>Semana aprobada: <select id="buyweek" onchange="showShopping(this.value)"><option value="">Elegí una semana</option>${chosen.map(([k])=>`<option value="${k}" ${k===current?'selected':''}>Desde ${k}</option>`).join('')}</select></label></div><div id="shopping"></div>`;showShopping(chosen.some(([k])=>k===current)?current:'')}else{a.innerHTML=`<h2>Preferencias</h2><div class="card"><h3>Comensales por comida</h3><p>Almuerzo: <input aria-label="Comensales almuerzo" type="number" min="1" max="20" value="${state.lunchPortions}" onchange="setPortions('lunchPortions',this.value)"></p><p>Cena: <input aria-label="Comensales cena" type="number" min="1" max="20" value="${state.dinnerPortions}" onchange="setPortions('dinnerPortions',this.value)"></p><p>Desayuno y merienda: <input aria-label="Comensales desayuno y merienda" type="number" min="1" max="20" value="${state.otherPortions}" onchange="setPortions('otherPortions',this.value)"></p><p class="muted">Cada comida y su lista de compras usan las porciones correspondientes.</p></div><div class="card"><h3>Reglas de Mi Cocina</h3><p>☕ Café con leche en todos los desayunos; se sugiere un acompañamiento.</p><p>🥩 Sábado al mediodía: asado.</p><p>🍝 Domingo al mediodía: pastas.</p><p>🍽️ La cena es la comida central familiar: 3 comensales, platos completos, variados y nutritivos. Primero se planifican las cenas y después el resto.</p><p>🥬 Variedad de frutas, verduras, proteínas y legumbres entre semanas.</p><p>Las propuestas son orientativas y se pueden editar antes de aprobar.</p></div><div class="card"><h3>Respaldo</h3><button class="action secondary" onclick="backup()">Exportar mis menús</button><p class="muted">Importante: los datos se guardan solo en este dispositivo y navegador.</p></div>`}}
function showShopping(k){let el=document.getElementById('shopping');if(!el)return;if(!k||!state.weeks[k]?.approved){el.innerHTML='<p class="notice">Aprobá un menú desde Semana para generar su lista.</p>';return}let days=state.weeks[k].days,items={};Object.values(days).forEach(meals=>meals.forEach((n,j)=>{for(let [ing,q] of R[n][0]){(items[ing]??=[]).push(`${q} × ${portionsFor(j)} (${MEALS[j]}: ${n})`)}}));el.innerHTML=`<p class="muted">Agrupá los ingredientes repetidos al comprar. Las cantidades se multiplican según los comensales de cada comida.</p><div class="card">${Object.entries(items).sort().map(([ing,vals])=>`<label style="display:block;margin:10px 0"><input type="checkbox"> <b>${escapeHTML(ing)}</b><div class="muted">${vals.map(escapeHTML).join('; ')}</div></label>`).join('')}</div><button class="action" onclick="copyShopping('${k}')">Copiar lista</button>`}
function copyShopping(k){let items={};Object.values(state.weeks[k].days).forEach(meals=>meals.forEach((n,j)=>R[n][0].forEach(([ing,q])=>(items[ing]??=[]).push(`${q} × ${portionsFor(j)} (${MEALS[j]})`))));let t=Object.entries(items).sort().map(([n,v])=>`${n}: ${v.join(' + ')}`).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('Lista copiada')).catch(()=>prompt('Copiá la lista:',t))}
function move(n){weekOffset+=n;render()}function openWeek(i){weekOffset=i;tab('Semana')}function approve(){let w=getWeek(add(start(new Date()),weekOffset*7));w.approved=!w.approved;save();render()}function regen(){let k=iso(add(start(new Date()),weekOffset*7));if(!confirm('¿Reemplazar la propuesta de esta semana?'))return;state.weeks[k]=generate(k);let d=state.weeks[k].days;for(let [date,arr] of Object.entries(d)){let day=new Date(date+'T12:00:00').getDay();if(day===6)arr[1]='Asado';if(day===0)arr[1]='Pastas del domingo'}save();render()}function setPortions(which,n){if(!['lunchPortions','dinnerPortions','otherPortions'].includes(which))return;state[which]=Math.min(20,Math.max(1,Number(n)||2));save();render()}function backup(){let b=new Blob([JSON.stringify({portions:state.otherPortions,lunchPortions:state.lunchPortions,dinnerPortions:state.dinnerPortions,otherPortions:state.otherPortions,weeks:state.weeks},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='mi-cocina-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
