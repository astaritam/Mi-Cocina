function portionsFor(j){return j===1?state.lunchPortions:j===3?state.dinnerPortions:state.otherPortions}function generate(w){let monday=new Date(w+'T12:00:00');let idx=Math.round((monday-new Date('2026-10-05T12:00:00'))/604800000);let data={};for(let i=0;i<7;i++){let day=add(monday,i),dow=day.getDay(),shift=((idx%7)+7)%7;data[iso(day)]=[B[(i+shift)%7],dow===6?'Asado':dow===0?'Pastas del domingo':(idx%2===0?L:ALT)[(i+shift)%7],B[(i+shift+3)%7],dinnerFor(day,idx,D[(i+shift+idx*3+D.length*100)%D.length])];}return {approved:false,days:data}};

 }

function getWeek(d){let k=iso(start(d));if(!state.weeks[k]){state.weeks[k]=generate(k);save()}return state.weeks[k]};function getMeals(d){return getWeek(d).days[iso(d)]};
function recipe(name,j=null){let [ings,steps]=R[name]||[[],[]];return `<details><summary>Ver receta completa</summary><p class="muted">Cantidades orientativas por persona. Ajustar a gusto.</p><b>Ingredientes</b><ul>${ings.map(([n,q])=>`<li>${escapeHTML(n)}: ${escapeHTML(q)}</li>`).join('')}</ul><b>Preparación</b><ol>${steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><p class="muted">Para ${j===null?'la cantidad de comensales de esa comida':portionsFor(j)+' personas'}, multiplicá las cantidades por ${j===null?'la cantidad correspondiente':portionsFor(j)}. No se incluyen videos sin enlaces verificados.</p></details>`}
function cardDay(d,edit=false){let meals=getMeals(d);return `<section class="card"><h3>${DAYS[d.getDay()]} ${label(d)}</h3>${MEALS.map((m,j)=>`<div class="meal"><strong>${m}</strong><p>${j===0?'☕ Café con leche + ':''}${escapeHTML(meals[j])}</p><span class="pill">${portionsFor(j)} personas</span>${recipe(meals[j],j)}${edit&&!(d.getDay()===6&&j===1)&&!(d.getDay()===0&&j===1)?`<button class="action secondary" onclick="changeMeal('${iso(d)}',${j})">Cambiar plato</button>`:''}</div>`).join('')}</section>`}
function changeMeal(day,j){let w=getWeek(new Date(day+'T12:00:00'));if(w.approved){alert('Para editar, primero reabrí el menú semanal.');return}let options=[...new Set(j===0||j===2?B:j===1?[...L,...ALT,...D]:[...D,...FIXED_MILANESAS,...FIXED_PASTAS,...FUN_DINNERS])];let current=w.days[day][j];let s=prompt('Escribí el número de la opción:\n'+options.map((x,i)=>`${i+1}. ${x}`).join('\n'),String(Math.max(1,options.indexOf(current)+1)));if(s===null)return;let n=Number(s);if(!Number.isInteger(n)||n<1||n>options.length){alert('Opción no válida');return}w.days[day][j]=options[n-1];save();render()}
function nav(){document.getElementById('nav').innerHTML=['Hoy','Semana','Mes','Recetas','Compras','Preferencias'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="tab('${t}')">${t}</button>`).join('')};function tab(t){state.tab=t;render()}
function render(){nav();let a=document.getElementById('app'),today=new Date(),mon=add(start(today),weekOffset*7),w=getWeek(mon);if(state.tab==='Hoy'){a.innerHTML=`<h2>Hoy · ${label(today)}</h2>${cardDay(today)}<button class="action" onclick="tab('Semana')">Ver semana y aprobar menú</button>`}else if(state.tab==='Semana'){a.innerHTML=`<h2>Menú semanal</h2><div class="row"><button class="action secondary" onclick="move(-1)">← Anterior</button><b>${label(mon)} – ${label(add(mon,6))}</b><button class="action secondary" onclick="move(1)">Siguiente →</button></div><p class="${w.approved?'ok':'notice'}">${w.approved?'✓ Menú aprobado. Ya podés consultar la lista de compras.':'Revisá las recetas y cambiá los platos que quieras antes de aprobar.'}</p>${Array.from({length:7},(_,i)=>cardDay(add(mon,i),true)).join('')}<button class="action ${w.approved?'danger':''}" onclick="approve()">${w.approved?'Reabrir menú para editar':'Aprobar menú semanal'}</button><button class="action secondary" onclick="regen()">Generar otra propuesta</button>`}else if(state.tab==='Mes'){let base=start(today);a.innerHTML=`<h2>Plan de las próximas 5 semanas</h2><p class="muted">Primero se organizan las cenas familiares; las propuestas rotan entre semanas. Los almuerzos del sábado y domingo se mantienen fijos.</p>${Array.from({length:5},(_,i)=>{let d=add(base,i*7),v=getWeek(d);return `<section class="card"><h3>Semana ${i+1}: ${label(d)} – ${label(add(d,6))}</h3><p>${v.approved?'✓ Aprobada':'Pendiente de aprobación'}</p><button class="action secondary" onclick="openWeek(${i})">Ver y editar semana</button></section>`}).join('')}`}else if(state.tab==='Recetas'){a.innerHTML=`<h2>Recetario</h2><p class="muted">Consultá ingredientes y pasos antes de elegir un plato.</p>${Object.keys(R).sort().map(n=>`<div class="card"><b>${escapeHTML(n)}</b>${recipe(n)}</div>`).join('')}`}else if(state.tab==='Compras'){let chosen=Object.entries(state.weeks).filter(([k,v])=>v.approved).sort((a,b)=>a[0].localeCompare(b[0]));let current=iso(mon);a.innerHTML=`<h2>Lista de compras</h2><p>Almuerzos para <b>${state.lunchPortions}</b>, cenas para <b>${state.dinnerPortions}</b> y desayunos/meriendas para <b>${state.otherPortions}</b>. Cantidades por plato y comida.</p><div class="row"><label>Semana aprobada: <select id="buyweek" onchange="showShopping(this.value)"><option value="">Elegí una semana</option>${chosen.map(([k])=>`<option value="${k}" ${k===current?'selected':''}>Desde ${k}</option>`).join('')}</select></label></div><div id="shopping"></div>`;showShopping(chosen.some(([k])=>k===current)?current:'')}else{a.innerHTML=`<h2>Preferencias</h2><div class="card"><h3>Comensales por comida</h3><p>Almuerzo: <input aria-label="Comensales almuerzo" type="number" min="1" max="20" value="${state.lunchPortions}" onchange="setPortions('lunchPortions',this.value)"></p><p>Cena: <input aria-label="Comensales cena" type="number" min="1" max="20" value="${state.dinnerPortions}" onchange="setPortions('dinnerPortions',this.value)"></p><p>Desayuno y merienda: <input aria-label="Comensales desayuno y merienda" type="number" min="1" max="20" value="${state.otherPortions}" onchange="setPortions('otherPortions',this.value)"></p><p class="muted">Cada comida y su lista de compras usan las porciones correspondientes.</p></div><div class="card"><h3>Reglas de Mi Cocina</h3><p>☕ Café con leche en todos los desayunos; se sugiere un acompañamiento.</p><p>🥩 Sábado al mediodía: asado.</p><p>🍝 Domingo al mediodía: pastas.</p><p>🍽️ La cena es la comida central familiar: 3 comensales, platos completos, variados y nutritivos. Primero se planifican las cenas y después el resto.</p><p>🥬 Variedad de frutas, verduras, proteínas y legumbres entre semanas.</p><p>Las propuestas son orientativas y se pueden editar antes de aprobar.</p></div><div class="card"><h3>Respaldo</h3><button class="action secondary" onclick="backup()">Exportar mis menús</button><p class="muted">Importante: los datos se guardan solo en este dispositivo y navegador.</p></div>`}}
function showShopping(k){let el=document.getElementById('shopping');if(!el)return;if(!k||!state.weeks[k]?.approved){el.innerHTML='<p class="notice">Aprobá un menú desde Semana para generar su lista.</p>';return}let days=state.weeks[k].days,items={};Object.values(days).forEach(meals=>meals.forEach((n,j)=>{for(let [ing,q] of R[n][0]){(items[ing]??=[]).push(`${q} × ${portionsFor(j)} (${MEALS[j]}: ${n})`)}}));el.innerHTML=`<p class="muted">Agrupá los ingredientes repetidos al comprar. Las cantidades se multiplican según los comensales de cada comida.</p><div class="card">${Object.entries(items).sort().map(([ing,vals])=>`<label style="display:block;margin:10px 0"><input type="checkbox"> <b>${escapeHTML(ing)}</b><div class="muted">${vals.map(escapeHTML).join('; ')}</div></label>`).join('')}</div><button class="action" onclick="copyShopping('${k}')">Copiar lista</button>`}
function copyShopping(k){let items={};Object.values(state.weeks[k].days).forEach(meals=>meals.forEach((n,j)=>R[n][0].forEach(([ing,q])=>(items[ing]??=[]).push(`${q} × ${portionsFor(j)} (${MEALS[j]})`))));let t=Object.entries(items).sort().map(([n,v])=>`${n}: ${v.join(' + ')}`).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('Lista copiada')).catch(()=>prompt('Copiá la lista:',t))}
function move(n){weekOffset+=n;render()}function openWeek(i){weekOffset=i;tab('Semana')}function approve(){let w=getWeek(add(start(new Date()),weekOffset*7));w.approved=!w.approved;save();render()}function regen(){let k=iso(add(start(new Date()),weekOffset*7));if(!confirm('¿Reemplazar la propuesta de esta semana?'))return;state.weeks[k]=generate(k);let d=state.weeks[k].days;for(let [date,arr] of Object.entries(d)){let day=new Date(date+'T12:00:00').getDay();if(day===6)arr[1]='Asado';if(day===0)arr[1]='Pastas del domingo'}save();render()}function setPortions(which,n){if(!['lunchPortions','dinnerPortions','otherPortions'].includes(which))return;state[which]=Math.min(20,Math.max(1,Number(n)||2));save();render()}function backup(){let b=new Blob([JSON.stringify({portions:state.otherPortions,lunchPortions:state.lunchPortions,dinnerPortions:state.dinnerPortions,otherPortions:state.otherPortions,weeks:state.weeks},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='mi-cocina-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
