const key='mi-cocina-v4';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}};state.lunchPortions=state.lunchPortions||2;state.dinnerPortions=state.dinnerPortions||3;state.otherPortions=state.otherPortions||state.portions||2;state.weeks=state.weeks||{};if(!state.menuRulesV5){for(const k of Object.keys(state.weeks)){if(!state.weeks[k].approved)delete state.weeks[k]}state.menuRulesV5=true;}if(!state.menuRulesV6){for(const k of Object.keys(state.weeks)){if(!state.weeks[k].approved)delete state.weeks[k]}state.menuRulesV6=true;}state.tab='Hoy';let weekOffset=0;const save=()=>localStorage.setItem(key,JSON.stringify({portions:state.otherPortions,lunchPortions:state.lunchPortions,dinnerPortions:state.dinnerPortions,otherPortions:state.otherPortions,weeks:state.weeks,menuRulesV5:state.menuRulesV5,menuRulesV6:state.menuRulesV6}));const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const start=d=>{let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const label=d=>d.toLocaleDateString('es-AR',{day:'numeric',month:'long'});const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

for(let i=0;i<5;i++){let day=iso(add(monday,i));let current=Object.values(data).flat().filter(Boolean);let fishCount=current.filter(n=>category(n)==='fish').length,legumes=current.filter(n=>category(n)==='legume').length,chicken=current.filter(n=>category(n)==='chicken').length,pork=current.filter(n=>category(n)==='pork').length;
let pool=lunches.filter(n=>!(category(n)==='fish'&&fishCount>=2)&&!(category(n)==='chicken'&&chicken>=1)&&!(category(n)==='pork'&&pork>=1));
if(i>=3&&legumes<2)pool=pool.filter(n=>category(n)==='legume');
let pick=choose(pool,data,day,1,idx*13+i*11,previous);if(!pick)pick=choose(lunches,data,day,1,idx*13+i*11,previous);data[day][1]=pick}
return {approved:false,days:data}}
function auditWeek(days){let issues=[];for(let [day,arr] of Object.entries(days)){for(let j of [1,3]){let n=arr[j];if(!n)continue;let du=duplicates(days,day,j,n);if(du.length)issues.push(`${day}: ${du[0]}`)}}return [...new Set(issues)]}
function getWeek(d){let k=iso(start(d));if(!state.weeks[k]){state.weeks[k]=generate(k);save()}return state.weeks[k]};function getMeals(d){let a=getWeek(d).days[iso(d)];if((d.getDay()===6||d.getDay()===0)&&a[3]!==null){a[3]=null;save()}return a};
function recipe(name,j=null){let [ings,steps]=R[name]||[[],[]];return `<details><summary>Ver receta completa</summary><p class="muted">Cantidades orientativas por persona. Ajustar a gusto.</p><b>Ingredientes</b><ul>${ings.map(([n,q])=>`<li>${escapeHTML(n)}: ${escapeHTML(q)}</li>`).join('')}</ul><b>Preparación</b><ol>${steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><p class="muted">Para ${j===null?'la cantidad de comensales de esa comida':portionsFor(j)+' personas'}, multiplicá las cantidades por ${j===null?'la cantidad correspondiente':portionsFor(j)}. No se incluyen videos sin enlaces verificados.</p></details>`}
function cardDay(d,edit=false){let meals=getMeals(d),dow=d.getDay();let entries=MEALS.map((m,j)=>{if(j===3&&(dow===6||dow===0))return '';let fixed=j===1&&(dow===6||dow===0);return `<div class="meal"><strong>${m}</strong><p>${j===0?'☕ Café con leche + ':''}${escapeHTML(meals[j])}</p><span class="pill">${portionsFor(j)} personas</span>${recipe(meals[j],j)}${edit&&!fixed?`<button class="action secondary" onclick="changeMeal('${iso(d)}',${j})">Cambiar plato</button>`:''}</div>`}).join('');let extras=extrasFor(d).map((name,i)=>`<div class="meal"><strong>${dow===6&&i===1?'🍮 Postre sugerido':'🥗 Acompañamiento sugerido'}</strong><p>${escapeHTML(name)}</p><span class="pill">${state.lunchPortions} personas</span>${recipe(name,1)}</div>`).join('');return `<section class="card"><h3>${DAYS[dow]} ${label(d)}</h3>${entries}${extras}</section>`}

function changeMeal(day,j){let dd=new Date(day+'T12:00:00');if((dd.getDay()===6||dd.getDay()===0)&&j===3)return;let w=getWeek(dd);if(w.approved){alert('Para editar, primero reabrí el menú semanal.');return}let options=j===0||j===2?[...B]:MAIN.filter(n=>j===1?!/^(Pizza casera|Empanadas caseras|Milanesas de carne)/.test(n):true);let current=w.days[day][j];let valid=options.filter(n=>n===current||!duplicates(w.days,day,j,n).length);if(j===3&&dd.getDay()===3)valid=valid.filter(n=>/milanesas de carne/i.test(n));if(j===3&&dd.getDay()===4)valid=valid.filter(n=>/ñoquis|ravioles|pasta/i.test(n));if(j===3&&dd.getDay()===5)valid=valid.filter(n=>/pizza|empanadas/i.test(n));let s=prompt('Elegí un número. Solo se muestran platos sin repeticiones en esta semana:\n'+valid.map((x,i)=>`${i+1}. ${x}${x===current?' (actual)':''}`).join('\n'),String(Math.max(1,valid.indexOf(current)+1)));if(s===null)return;let n=Number(s);if(!Number.isInteger(n)||n<1||n>valid.length){alert('Opción no válida');return}let choice=valid[n-1],conflicts=duplicates(w.days,day,j,choice);if(conflicts.length){alert('Ese plato se repite: '+conflicts.join('; '));return}w.days[day][j]=choice;save();render()}
function nav(){document.getElementById('nav').innerHTML=['Hoy','Semana','Mes','Recetas','Compras','Preferencias'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="tab('${t}')">${t}</button>`).join('')};function tab(t){state.tab=t;render()}
function render(){nav();let a=document.getElementById('app'),today=new Date(),mon=add(start(today),weekOffset*7),w=getWeek(mon);if(state.tab==='Hoy'){a.innerHTML=`<h2>Hoy · ${label(today)}</h2>${cardDay(today)}<button class="action" onclick="tab('Semana')">Ver semana y aprobar menú</button>`}else if(state.tab==='Semana'){a.innerHTML=`<h2>Menú semanal</h2><div class="row"><button class="action secondary" onclick="move(-1)">← Anterior</button><b>${label(mon)} – ${label(add(mon,6))}</b><button class="action secondary" onclick="move(1)">Siguiente →</button></div><p class="${w.approved?'ok':'notice'}">${w.approved?'✓ Menú aprobado. Ya podés consultar la lista de compras.':'Revisá las recetas y cambiá los platos que quieras antes de aprobar.'}</p>${Array.from({length:7},(_,i)=>cardDay(add(mon,i),true)).join('')}<button class="action ${w.approved?'danger':''}" onclick="approve()">${w.approved?'Reabrir menú para editar':'Aprobar menú semanal'}</button><button class="action secondary" onclick="regen()">Generar otra propuesta</button>`}else if(state.tab==='Mes'){let base=start(today);a.innerHTML=`<h2>Plan de las próximas 5 semanas</h2><p class="muted">Primero se organizan las cenas familiares; las propuestas rotan entre semanas. Los almuerzos del fin de semana tienen acompañamientos variados; el sábado también incluye postre. No se planifican cenas sábados ni domingos.</p>${Array.from({length:5},(_,i)=>{let d=add(base,i*7),v=getWeek(d);return `<section class="card"><h3>Semana ${i+1}: ${label(d)} – ${label(add(d,6))}</h3><p>${v.approved?'✓ Aprobada':'Pendiente de aprobación'}</p><button class="action secondary" onclick="openWeek(${i})">Ver y editar semana</button></section>`}).join('')}`}else if(state.tab==='Recetas'){a.innerHTML=`<h2>Recetario</h2><p class="muted">Consultá ingredientes y pasos antes de elegir un plato.</p>${Object.keys(R).sort().map(n=>`<div class="card"><b>${escapeHTML(n)}</b>${recipe(n)}</div>`).join('')}`}else if(state.tab==='Compras'){let chosen=Object.entries(state.weeks).filter(([k,v])=>v.approved).sort((a,b)=>a[0].localeCompare(b[0]));let current=iso(mon);a.innerHTML=`<h2>Lista de compras</h2><p>Almuerzos para <b>${state.lunchPortions}</b>, cenas para <b>${state.dinnerPortions}</b> y desayunos/meriendas para <b>${state.otherPortions}</b>. Cantidades por plato y comida.</p><div class="row"><label>Semana aprobada: <select id="buyweek" onchange="showShopping(this.value)"><option value="">Elegí una semana</option>${chosen.map(([k])=>`<option value="${k}" ${k===current?'selected':''}>Desde ${k}</option>`).join('')}</select></label></div><div id="shopping"></div>`;showShopping(chosen.some(([k])=>k===current)?current:'')}else{a.innerHTML=`<h2>Preferencias</h2><div class="card"><h3>Comensales por comida</h3><p>Almuerzo: <input aria-label="Comensales almuerzo" type="number" min="1" max="20" value="${state.lunchPortions}" onchange="setPortions('lunchPortions',this.value)"></p><p>Cena: <input aria-label="Comensales cena" type="number" min="1" max="20" value="${state.dinnerPortions}" onchange="setPortions('dinnerPortions',this.value)"></p><p>Desayuno y merienda: <input aria-label="Comensales desayuno y merienda" type="number" min="1" max="20" value="${state.otherPortions}" onchange="setPortions('otherPortions',this.value)"></p><p class="muted">Cada comida y su lista de compras usan las porciones correspondientes.</p></div><div class="card"><h3>Reglas de Mi Cocina</h3><p>☕ Café con leche en todos los desayunos; se sugiere un acompañamiento.</p><p>🥩 Sábado al mediodía: asado + acompañamiento + postre rotativos.</p><p>🍝 Domingo al mediodía: pastas + acompañamiento rotativo.</p><p>🌙 Sábados y domingos a la noche: sin sugerencias.</p><p>🍽️ La cena es la comida central familiar: 3 comensales, platos completos, variados y nutritivos. Primero se planifican las cenas y después el resto.</p><p>🥬 Sin platos ni combinaciones repetidas en la semana; pescados de distintas especies y rotación de legumbres, proteínas y verduras entre semanas.</p><p>Las propuestas son orientativas y se pueden editar antes de aprobar.</p></div><div class="card"><h3>Respaldo</h3><button class="action secondary" onclick="backup()">Exportar mis menús</button><p class="muted">Importante: los datos se guardan solo en este dispositivo y navegador.</p></div>`}}
function showShopping(k){let el=document.getElementById('shopping');if(!el)return;if(!k||!state.weeks[k]?.approved){el.innerHTML='<p class="notice">Aprobá un menú desde Semana para generar su lista.</p>';return}let days=state.weeks[k].days,items={};Object.entries(days).forEach(([date,meals])=>{let d=new Date(date+'T12:00:00');mealParts(d,meals).forEach(({name:n,j})=>{if(!n||!R[n])return;for(let [ing,q] of R[n][0]){(items[ing]??=[]).push(`${q} × ${portionsFor(j)} (${MEALS[j]}: ${n})`)}})});el.innerHTML=`<p class="muted">Agrupá los ingredientes repetidos al comprar. Las cantidades se multiplican según los comensales de cada comida.</p><div class="card">${Object.entries(items).sort().map(([ing,vals])=>`<label style="display:block;margin:10px 0"><input type="checkbox"> <b>${escapeHTML(ing)}</b><div class="muted">${vals.map(escapeHTML).join('; ')}</div></label>`).join('')}</div><button class="action" onclick="copyShopping('${k}')">Copiar lista</button>`}
function copyShopping(k){let items={};Object.entries(state.weeks[k].days).forEach(([date,meals])=>{let d=new Date(date+'T12:00:00');mealParts(d,meals).forEach(({name:n,j})=>{if(R[n])R[n][0].forEach(([ing,q])=>(items[ing]??=[]).push(`${q} × ${portionsFor(j)} (${MEALS[j]})`))})});let t=Object.entries(items).sort().map(([n,v])=>`${n}: ${v.join(' + ')}`).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('Lista copiada')).catch(()=>prompt('Copiá la lista:',t))}
function move(n){weekOffset+=n;render()}function openWeek(i){weekOffset=i;tab('Semana')}function approve(){let w=getWeek(add(start(new Date()),weekOffset*7));if(!w.approved){let issues=auditWeek(w.days);if(issues.length){alert('Hay repeticiones en el menú. Cambiá los platos señalados antes de aprobar:\n'+[...new Set(issues)].slice(0,12).join('\n'));return}}w.approved=!w.approved;save();render()}function regen(){let k=iso(add(start(new Date()),weekOffset*7));if(state.weeks[k]?.approved){alert('Primero reabrí el menú aprobado.');return}if(!confirm('¿Reemplazar la propuesta de esta semana?'))return;state.weeks[k]=generate(k);let d=state.weeks[k].days;for(let [date,arr] of Object.entries(d)){let day=new Date(date+'T12:00:00').getDay();if(day===6)arr[1]='Asado';if(day===0)arr[1]='Pastas del domingo';if(day===6||day===0)arr[3]=null}save();render()}function setPortions(which,n){if(!['lunchPortions','dinnerPortions','otherPortions'].includes(which))return;state[which]=Math.min(20,Math.max(1,Number(n)||2));save();render()}function backup(){let b=new Blob([JSON.stringify({portions:state.otherPortions,lunchPortions:state.lunchPortions,dinnerPortions:state.dinnerPortions,otherPortions:state.otherPortions,weeks:state.weeks},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='mi-cocina-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
