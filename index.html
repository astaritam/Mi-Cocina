for(let n of MAIN)if(!FISH_SPECIES(n)&&!/^(Pizza|Empanadas|Milanesas|Pasta|Ravioles|Ñoquis|Sorrentinos|Fideos)/i.test(n)&&!lunches.includes(n))lunches.push(n);
 for(let i=0;i<5;i++){let day=iso(add(monday,i));let pool=lunches.filter(n=>!FISH_SPECIES(n)&&!used.has(n)&&!duplicates(data,day,1,n).length);let choice=pool[mod(idx*11+i*13,pool.length)];data[day][1]=choice;used.add(choice)}return {approved:false,days:data}}
function getWeek(d){let k=iso(start(d));if(!state.weeks[k]){state.weeks[k]=generate(k);save()}return state.weeks[k]};function getMeals(d){let a=getWeek(d).days[iso(d)];if((d.getDay()===6||d.getDay()===0)&&a[3]!==null){a[3]=null;save()}if(a[1]&&FISH_SPECIES(a[1])){a[1]=choose(Object.keys(R).filter(n=>!FISH_SPECIES(n)&&!B.includes(n)&&!ASADO_SIDES.includes(n)&&!PASTA_SIDES.includes(n)&&!SAT_DESSERTS.includes(n)),getWeek(d).days,iso(d),1,d.getDate());save()}return a};
function recipe(name,j=null){let [ings,steps]=R[name]||[[],[]];let excel=Object.prototype.hasOwnProperty.call(EXCEL_RECIPES,name);let count=j===null?3:portionsFor(j);return `<details><summary>Ver receta completa</summary><p class="muted">${excel?`Cantidades del Excel para 3 personas; para esta comida multiplicar por ${Number((count/3).toFixed(3))}.`:`Cantidades orientativas por persona. Ajustar a gusto.`}</p><b>Ingredientes</b><ul>${ings.map(([n,q])=>`<li>${escapeHTML(n)}: ${escapeHTML(q)}</li>`).join('')}</ul><b>Preparación</b><ol>${steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><p class="muted">Para ${j===null?'la cantidad de comensales de esa comida':portionsFor(j)+' personas'}, multiplicá las cantidades por ${excel?Number((count/3).toFixed(3)):(j===null?'la cantidad correspondiente':portionsFor(j))}. No se incluyen videos sin enlaces verificados.</p></details>`}
function cardDay(d,edit=false){let meals=getMeals(d),dow=d.getDay();let entries=MEALS.map((m,j)=>{if(j===3&&(dow===6||dow===0))return '';let fixed=j===1&&(dow===6||dow===0);let extras=j===1?extrasFor(d).map((name,i)=>`<div class="meal" style="margin-left:14px;padding-left:12px;border-left:3px solid #d9e9dd"><strong>${dow===6&&i===1?'🍮 Postre sugerido':'🥗 Acompañamiento sugerido'}</strong><p>${escapeHTML(name)}</p>${recipe(name,1)}</div>`).join(''):'';return `<div class="meal"><strong>${m}</strong><p>${j===0?'☕ Café con leche + ':''}${escapeHTML(meals[j])}</p><span class="pill">${portionsFor(j)} personas</span>${recipe(meals[j],j)}${extras}${edit&&!fixed?`<button class="action secondary" onclick="changeMeal('${iso(d)}',${j})">Cambiar plato</button>`:''}</div>`}).join('');return `<section class="card"><h3>${DAYS[dow]} ${label(d)}</h3>${entries}</section>`}

let pickerState=null;
function changeMeal(day,j){
 let dd=new Date(day+'T12:00:00');if((dd.getDay()===6||dd.getDay()===0)&&j===3)return;
 let w=getWeek(dd);if(w.approved){alert('Para editar, primero reabrí el menú semanal.');return}
 pickerState={day,j,shown:30,search:'',category:'Todas',rotation:0};drawPicker();
}
function pickerOptions(){
 if(!pickerState)return [];
 let {day,j,search,category,rotation}=pickerState,w=getWeek(new Date(day+'T12:00:00'));
 let pool=j===0||j===2?[...B]:MAIN.filter(n=>j===1?!FISH_SPECIES(n)&&!/^(Pizza casera|Empanadas caseras|Milanesas de carne)/.test(n):true);
 // No mostrar platos de acompañamiento o postres como comidas principales.
 pool=pool.filter(n=>!ASADO_SIDES.includes(n)&&!PASTA_SIDES.includes(n)&&!SAT_DESSERTS.includes(n));
 const group=n=>FISH_SPECIES(n)?'Pescados':/pollo/i.test(n)?'Pollo':/cerdo|bondiola/i.test(n)?'Cerdo':/carne|peceto|osobuco|roast beef|milanesa/i.test(n)?'Carne':/lenteja|garbanzo|poroto|alubia|pallar|haba|arveja/i.test(n)?'Legumbres':/pasta|raviol|ñoqui|pizza|empanada/i.test(n)?'Pastas y masas':'Verduras y otros';
 let current=w.days[day][j];
 pool=pool.filter(n=>(n===current||!duplicates(w.days,day,j,n).length)&&(!search||MAIN_KEY(n).includes(MAIN_KEY(search)))&&(category==='Todas'||group(n)===category));
 // Rotar el orden de las alternativas sin perder opciones del recetario.
 if(pool.length){let offset=rotation%pool.length;pool=[...pool.slice(offset),...pool.slice(0,offset)]}
 return pool;
}
function drawPicker(){
 document.getElementById('meal-picker')?.remove();if(!pickerState)return;
 let {day,j,shown,search,category}=pickerState,options=pickerOptions();
 let cats=j===0||j===2?[]:['Todas','Pescados','Pollo','Cerdo','Carne','Legumbres','Pastas y masas','Verduras y otros'];
 let wrap=document.createElement('div');wrap.id='meal-picker';wrap.className='picker-overlay';
 wrap.innerHTML=`<div class="picker" role="dialog" aria-modal="true" aria-label="Cambiar plato"><div class="row" style="justify-content:space-between"><h3>Cambiar ${MEALS[j].toLowerCase()}</h3><button class="action secondary" onclick="closePicker()">Cerrar ✕</button></div><p class="muted">${options.length} opciones compatibles con el menú actual. Buscá, filtrá o pedí más alternativas.</p><input id="pick-search" placeholder="Buscar plato o ingrediente…" value="${escapeHTML(search)}" oninput="pickerSearch(this.value)">${cats.length?`<select id="pick-category" onchange="pickerCategory(this.value)" style="margin-top:8px">${cats.map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select>`:''}<div>${options.slice(0,shown).map(n=>`<div class="pick-item"><div><b>${escapeHTML(n)}</b>${n===getWeek(new Date(day+'T12:00:00')).days[day][j]?'<span class="pill">Actual</span>':''}</div><button class="action secondary" data-recipe="${escapeHTML(n)}">Elegir</button></div>`).join('')||'<p>No hay coincidencias. Probá otra búsqueda o categoría.</p>'}</div><div class="row" style="margin-top:12px">${shown<options.length?'<button class="action" onclick="pickerMore()">Mostrar más opciones</button>':''}<button class="action secondary" onclick="pickerRotate()">Cambiar orden de sugerencias</button></div></div>`;
 document.body.appendChild(wrap);
 wrap.addEventListener('click',e=>{if(e.target===wrap)closePicker();let btn=e.target.closest('[data-recipe]');if(btn)selectPickerMeal(btn.dataset.recipe)});
}
function pickerSearch(v){let pos=document.getElementById('pick-search')?.selectionStart;pickerState.search=v;pickerState.shown=30;drawPicker();let el=document.getElementById('pick-search');el?.focus();if(el&&pos!==null)el.setSelectionRange(pos,pos)}
function pickerCategory(v){pickerState.category=v;pickerState.shown=30;drawPicker()}
function pickerMore(){pickerState.shown+=12;drawPicker()}
function pickerRotate(){pickerState.rotation+=7;drawPicker()}
function closePicker(){pickerState=null;document.getElementById('meal-picker')?.remove()}
function selectPickerMeal(name){if(!pickerState)return;let {day,j}=pickerState,w=getWeek(new Date(day+'T12:00:00'));if(!pickerOptions().includes(name))return;w.days[day][j]=name;save();closePicker();render()}
function nav(){document.getElementById('nav').innerHTML=['Hoy','Semana','Mes','Recetas','Compras','Preferencias'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="tab('${t}')">${t}</button>`).join('')};function tab(t){state.tab=t;render()}
function render(){nav();let a=document.getElementById('app'),today=new Date(),mon=add(start(today),weekOffset*7),w=getWeek(mon);if(state.tab==='Hoy'){a.innerHTML=`<h2>Hoy · ${label(today)}</h2>${cardDay(today)}<button class="action" onclick="tab('Semana')">Ver semana y aprobar menú</button>`}else if(state.tab==='Semana'){a.innerHTML=`<h2>Menú semanal</h2><div class="row"><button class="action secondary" onclick="move(-1)">← Anterior</button><b>${label(mon)} – ${label(add(mon,6))}</b><button class="action secondary" onclick="move(1)">Siguiente →</button></div><p class="${w.approved?'ok':'notice'}">${w.approved?'✓ Menú aprobado. Ya podés consultar la lista de compras.':'Revisá las recetas y cambiá los platos que quieras antes de aprobar.'}</p>${Array.from({length:7},(_,i)=>cardDay(add(mon,i),true)).join('')}<button class="action ${w.approved?'danger':''}" onclick="approve()">${w.approved?'Reabrir menú para editar':'Aprobar menú semanal'}</button><button class="action secondary" onclick="regen()">Generar otra propuesta</button>`}else if(state.tab==='Mes'){let base=start(today);a.innerHTML=`<h2>Plan de las próximas 5 semanas</h2><p class="muted">Primero se organizan las cenas familiares; las propuestas rotan entre semanas. Los almuerzos del fin de semana tienen acompañamientos variados; el sábado también incluye postre. No se planifican cenas sábados ni domingos.</p>${Array.from({length:5},(_,i)=>{let d=add(base,i*7),v=getWeek(d);return `<section class="card"><h3>Semana ${i+1}: ${label(d)} – ${label(add(d,6))}</h3><p>${v.approved?'✓ Aprobada':'Pendiente de aprobación'}</p><button class="action secondary" onclick="openWeek(${i})">Ver y editar semana</button></section>`}).join('')}`}else if(state.tab==='Recetas'){a.innerHTML=`<h2>Recetario · ${Object.keys(R).length} recetas</h2><p class="muted">Incluye las 150 recetas del Excel, además de las anteriores. Las recetas del Excel indican cantidades para tres personas.</p>${Object.keys(R).sort().map(n=>`<div class="card"><b>${escapeHTML(n)}</b>${recipe(n)}</div>`).join('')}`}else if(state.tab==='Compras'){let chosen=Object.entries(state.weeks).filter(([k,v])=>v.approved).sort((a,b)=>a[0].localeCompare(b[0]));let current=iso(mon);a.innerHTML=`<h2>Lista de compras</h2><p>Almuerzos para <b>${state.lunchPortions}</b>, cenas para <b>${state.dinnerPortions}</b> y desayunos/meriendas para <b>${state.otherPortions}</b>. Cantidades por plato y comida.</p><div class="row"><label>Semana aprobada: <select id="buyweek" onchange="showShopping(this.value)"><option value="">Elegí una semana</option>${chosen.map(([k])=>`<option value="${k}" ${k===current?'selected':''}>Desde ${k}</option>`).join('')}</select></label></div><div id="shopping"></div>`;showShopping(chosen.some(([k])=>k===current)?current:'')}else{a.innerHTML=`<h2>Preferencias</h2><div class="card"><h3>Comensales por comida</h3><p>Almuerzo: <input aria-label="Comensales almuerzo" type="number" min="1" max="20" value="${state.lunchPortions}" onchange="setPortions('lunchPortions',this.value)"></p><p>Cena: <input aria-label="Comensales cena" type="number" min="1" max="20" value="${state.dinnerPortions}" onchange="setPortions('dinnerPortions',this.value)"></p><p>Desayuno y merienda: <input aria-label="Comensales desayuno y merienda" type="number" min="1" max="20" value="${state.otherPortions}" onchange="setPortions('otherPortions',this.value)"></p><p class="muted">Cada comida y su lista de compras usan las porciones correspondientes.</p></div><div class="card"><h3>Reglas de Mi Cocina</h3><p>☕ Café con leche en todos los desayunos; se sugiere un acompañamiento.</p><p>🥩 Sábado al mediodía: asado + acompañamiento + postre rotativos.</p><p>🍝 Domingo al mediodía: pastas + acompañamiento rotativo.</p><p>🌙 Sábados y domingos a la noche: sin sugerencias.</p><p>🍽️ La cena es la comida central familiar: 3 comensales, platos completos, variados y nutritivos. Primero se planifican las cenas y después el resto.</p><p>🥬 Rotación amplia de legumbres, frutas y verduras de estación en Buenos Aires, sin rigidez, y cortes de vaca, pollo y cerdo. Pescado solamente en cenas. Evitar platos repetidos durante la semana y variar entre semanas.</p><p>Las propuestas son orientativas y se pueden editar antes de aprobar.</p></div><div class="card"><h3>Respaldo</h3><button class="action secondary" onclick="backup()">Exportar mis menús</button><p class="muted">Importante: los datos se guardan solo en este dispositivo y navegador.</p></div>`}}
function showShopping(k){let el=document.getElementById('shopping');if(!el)return;if(!k||!state.weeks[k]?.approved){el.innerHTML='<p class="notice">Aprobá un menú desde Semana para generar su lista.</p>';return}let days=state.weeks[k].days,items={};Object.entries(days).forEach(([date,meals])=>{let d=new Date(date+'T12:00:00');mealParts(d,meals).forEach(({name:n,j})=>{if(!n||!R[n])return;for(let [ing,q] of R[n][0]){(items[ing]??=[]).push(`${q} × ${EXCEL_RECIPES[n]?Number((portionsFor(j)/3).toFixed(3)):portionsFor(j)} (${MEALS[j]}: ${n})`)}})});el.innerHTML=`<p class="muted">Agrupá los ingredientes repetidos al comprar. Las cantidades se multiplican según los comensales de cada comida.</p><div class="card">${Object.entries(items).sort().map(([ing,vals])=>`<label style="display:block;margin:10px 0"><input type="checkbox"> <b>${escapeHTML(ing)}</b><div class="muted">${vals.map(escapeHTML).join('; ')}</div></label>`).join('')}</div><button class="action" onclick="copyShopping('${k}')">Copiar lista</button>`}
function copyShopping(k){let items={};Object.entries(state.weeks[k].days).forEach(([date,meals])=>{let d=new Date(date+'T12:00:00');mealParts(d,meals).forEach(({name:n,j})=>{if(R[n])R[n][0].forEach(([ing,q])=>(items[ing]??=[]).push(`${q} × ${EXCEL_RECIPES[n]?Number((portionsFor(j)/3).toFixed(3)):portionsFor(j)} (${MEALS[j]})`))})});let t=Object.entries(items).sort().map(([n,v])=>`${n}: ${v.join(' + ')}`).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('Lista copiada')).catch(()=>prompt('Copiá la lista:',t))}
function move(n){weekOffset+=n;render()}function openWeek(i){weekOffset=i;tab('Semana')}function approve(){let w=getWeek(add(start(new Date()),weekOffset*7));if(!w.approved){let issues=[];for(const [day,arr] of Object.entries(w.days))for(const j of [1,3])if(arr[j]){let dup=duplicates(w.days,day,j,arr[j]);if(dup.length)issues.push(`${day}: ${dup[0]}`)}if(issues.length){alert('Hay repeticiones en el menú. Cambiá los platos señalados antes de aprobar:\n'+[...new Set(issues)].slice(0,12).join('\n'));return}}w.approved=!w.approved;save();render()}function regen(){let k=iso(add(start(new Date()),weekOffset*7));if(!confirm('¿Reemplazar la propuesta de esta semana?'))return;state.generation=(state.generation||0)+1;state.weeks[k]=generate(k);let d=state.weeks[k].days;for(let [date,arr] of Object.entries(d)){let day=new Date(date+'T12:00:00').getDay();if(day===6)arr[1]='Asado';if(day===0)arr[1]='Pastas del domingo';if(day===6||day===0)arr[3]=null}save();render()}function setPortions(which,n){if(!['lunchPortions','dinnerPortions','otherPortions'].includes(which))return;state[which]=Math.min(20,Math.max(1,Number(n)||2));save();render()}function backup(){let b=new Blob([JSON.stringify({portions:state.otherPortions,lunchPortions:state.lunchPortions,dinnerPortions:state.dinnerPortions,otherPortions:state.otherPortions,weeks:state.weeks},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='mi-cocina-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
