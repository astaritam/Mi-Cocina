<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#23634c"><title>Mi Cocina</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" type="image/png"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20342b;background:#f5f7f2}*{box-sizing:border-box}body{margin:0}header{background:#23634c;color:white;padding:22px 18px 16px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;opacity:.9}nav{display:flex;overflow-x:auto;background:white;position:sticky;top:0;box-shadow:0 2px 8px #0001}nav button{border:0;background:transparent;padding:15px 13px;font-weight:650;color:#526359;white-space:nowrap}nav button.active{color:#23634c;border-bottom:3px solid #23634c}main{max-width:760px;margin:auto;padding:18px 14px 70px}.card{background:white;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #243b2910}h2{margin:6px 0 14px;font-size:23px}h3{margin:0 0 8px;font-size:18px}p{line-height:1.45}small,.muted{color:#627469}button.primary{background:#23634c;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700}button.secondary{background:#e5efe8;color:#20553f;border:0;border-radius:10px;padding:10px 13px;font-weight:650}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.meal{border-top:1px solid #e7ece7;padding:11px 0}.meal:first-of-type{border-top:0}.meal strong{display:block;margin-bottom:5px}.meal button{margin-top:7px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{display:inline-block;background:#e8f1e9;border-radius:100px;padding:5px 10px;font-size:12px;color:#23634c}details{margin:9px 0}summary{cursor:pointer;font-weight:650}li{margin:5px 0}input[type=number],select{padding:9px;border:1px solid #ccd8ce;border-radius:8px;max-width:130px}label{display:block;margin:10px 0}input[type=checkbox]{accent-color:#23634c} .notice{background:#fff4d7;border-radius:12px;padding:12px;margin:12px 0} .hidden{display:none}footer{text-align:center;color:#708075;font-size:12px;padding:16px}
</style></head><body><header><h1>🥬 Mi Cocina</h1><p>Comé rico, variado y organizado</p></header><nav id="nav"></nav><main id="app"></main><footer>Mi Cocina · Los datos se guardan en este navegador</footer><script>
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];const MEALS=['Desayuno','Almuerzo','Merienda','Cena'];
const recipes=[
{id:'yogur',name:'Yogur con fruta y nueces',serv:1,ingredients:[['Yogur natural',180,'g'],['Banana',1,'unidad'],['Nueces',20,'g']],steps:['Cortar la fruta.','Servir sobre el yogur y agregar las nueces.'],tags:['desayuno','merienda']},
{id:'tostadas',name:'Tostadas integrales con palta y huevo',serv:1,ingredients:[['Pan integral',2,'rebanadas'],['Palta',0.5,'unidad'],['Huevo',1,'unidad'],['Limón',0.25,'unidad']],steps:['Tostar el pan.','Pisar la palta con limón.','Cocinar el huevo y servir sobre las tostadas.'],tags:['desayuno','merienda']},
{id:'avena',name:'Avena con manzana y canela',serv:1,ingredients:[['Avena',50,'g'],['Leche',180,'ml'],['Manzana',1,'unidad'],['Canela',1,'pizca']],steps:['Calentar la avena con la leche durante 5 minutos.','Agregar manzana cortada y canela.'],tags:['desayuno','merienda']},
{id:'licuado',name:'Licuado de banana y tostada con ricota',serv:1,ingredients:[['Banana',1,'unidad'],['Leche',200,'ml'],['Pan integral',1,'rebanada'],['Ricota',40,'g']],steps:['Licuar la banana con leche.','Tostar el pan y untar con ricota.'],tags:['desayuno','merienda']},
{id:'merluza',name:'Merluza al horno con puré de calabaza y zanahoria',serv:2,ingredients:[['Filet de merluza',400,'g'],['Calabaza',500,'g'],['Zanahoria',250,'g'],['Limón',1,'unidad'],['Aceite de oliva',2,'cda']],steps:['Calentar el horno a 200 °C.','Hornear la calabaza y la zanahoria en cubos durante 25–35 minutos.','Añadir la merluza condimentada y hornear 12–18 minutos, hasta que esté cocida.','Pisar las verduras y servir con limón.'],tags:['almuerzo','cena']},
{id:'lentejas',name:'Ensalada tibia de lentejas y remolacha',serv:2,ingredients:[['Lentejas secas',160,'g'],['Remolacha',2,'unidades'],['Tomate',2,'unidades'],['Cebolla',0.5,'unidad'],['Aceite de oliva',2,'cda']],steps:['Cocinar las lentejas hasta que estén tiernas.','Hervir o asar la remolacha y cortarla.','Mezclar con tomate y cebolla picados; aliñar.'],tags:['almuerzo','cena']},
{id:'pollo',name:'Pollo con brócoli y arroz integral',serv:2,ingredients:[['Pollo',350,'g'],['Brócoli',1,'unidad'],['Arroz integral',140,'g'],['Ajo',1,'diente'],['Aceite de oliva',2,'cda']],steps:['Cocinar el arroz según el envase.','Cocinar el pollo hasta que esté completamente hecho.','Cocinar el brócoli al vapor 5–7 minutos y saltear brevemente con ajo.'],tags:['almuerzo','cena']},
{id:'berenjena',name:'Berenjenas al horno con tomate y queso',serv:2,ingredients:[['Berenjena',2,'unidades'],['Tomate',3,'unidades'],['Mozzarella',120,'g'],['Aceite de oliva',2,'cda']],steps:['Cortar las berenjenas y hornear a 200 °C por 20 minutos.','Cubrir con tomate y queso.','Hornear 10–15 minutos más, hasta gratinar.'],tags:['almuerzo','cena']},
{id:'garbanzos',name:'Garbanzos con espinaca y huevo',serv:2,ingredients:[['Garbanzos cocidos',350,'g'],['Espinaca',250,'g'],['Huevos',2,'unidades'],['Cebolla',1,'unidad'],['Aceite de oliva',1,'cda']],steps:['Rehogar la cebolla.','Agregar espinaca lavada y garbanzos cocidos; calentar bien.','Cocinar los huevos a gusto y servir encima.'],tags:['almuerzo','cena']},
{id:'carne',name:'Carne braseada con papas y zanahorias',serv:2,ingredients:[['Roast beef',400,'g'],['Papa',350,'g'],['Zanahoria',250,'g'],['Cebolla',1,'unidad'],['Tomate triturado',200,'g']],steps:['Dorar la carne en una olla.','Agregar cebolla, tomate y un poco de agua; tapar y cocinar a fuego bajo 60–90 minutos.','Incorporar papas y zanahorias y cocinar hasta que estén tiernas y la carne esté bien cocida.'],tags:['almuerzo','cena']},
{id:'tortilla',name:'Tortilla de acelga con ensalada de lechuga',serv:2,ingredients:[['Acelga',1,'atado'],['Huevos',4,'unidades'],['Lechuga',1,'planta'],['Tomate',2,'unidades'],['Aceite de oliva',1,'cda']],steps:['Lavar y cocinar la acelga; escurrir muy bien.','Mezclar con los huevos batidos.','Cocinar en sartén por ambos lados hasta cuajar completamente.','Servir con lechuga y tomate.'],tags:['almuerzo','cena']},
{id:'pasta',name:'Pasta integral con salsa de champiñones',serv:2,ingredients:[['Pasta integral',180,'g'],['Champiñones',250,'g'],['Queso crema',80,'g'],['Leche',60,'ml'],['Ajo',1,'diente']],steps:['Hervir la pasta.','Saltear ajo y champiñones.','Agregar queso crema y leche, calentar y mezclar con la pasta.'],tags:['almuerzo','cena']},
{id:'souffle',name:'Soufflé de boniato y espinaca',serv:2,ingredients:[['Boniato',450,'g'],['Espinaca',200,'g'],['Huevos',2,'unidades'],['Queso rallado',35,'g']],steps:['Hornear los boniatos hasta que estén tiernos y hacer puré.','Cocinar y escurrir la espinaca.','Mezclar yemas, espinaca, puré y queso; incorporar claras batidas a nieve.','Hornear en fuente a 180 °C durante 25–35 minutos hasta que esté firme.'],tags:['almuerzo','cena']},
{id:'ensalada',name:'Ensalada de atún, porotos y verduras',serv:2,ingredients:[['Atún al natural',2,'latas'],['Porotos cocidos',300,'g'],['Lechuga',0.5,'planta'],['Tomate',2,'unidades'],['Limón',1,'unidad']],steps:['Enjuagar los porotos y escurrir el atún.','Lavar y cortar las verduras.','Mezclar y condimentar con limón.'],tags:['almuerzo','cena']}
];
const pools={Desayuno:['yogur','tostadas','avena','licuado'],Merienda:['licuado','avena','yogur','tostadas'],Almuerzo:['merluza','lentejas','pollo','berenjena','garbanzos','carne','tortilla'],Cena:['souffle','pasta','ensalada','pollo','merluza','berenjena','garbanzos']};
const $=s=>document.querySelector(s);const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let prefs=load('mc_prefs',{people:2,avoid:[]}),weeks=load('mc_weeks',{}),tab='Hoy',selectedWeek=0;const save=()=>{localStorage.setItem('mc_prefs',JSON.stringify(prefs));localStorage.setItem('mc_weeks',JSON.stringify(weeks))};const monday=(date=new Date())=>{let d=new Date(date);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d};const keyFor=n=>{let d=monday();d.setDate(d.getDate()+7*n);return d.toISOString().slice(0,10)};const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'});const getRecipe=id=>recipes.find(r=>r.id===id);const makeWeek=n=>{let w={approved:false,days:DAYS.map((_,i)=>Object.fromEntries(MEALS.map((m,j)=>{let arr=pools[m].filter(id=>!prefs.avoid.includes(id));return [m,arr.length?arr[(i+(n*3)+Math.floor(i/2)+(j===3?2:0))%arr.length]:pools[m][0]]}))) };return w};const getWeek=n=>weeks[keyFor(n)]??makeWeek(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function recipeHtml(id,compact=false){let r=getRecipe(id);if(!r)return '';let factor=prefs.people/r.serv;return `<details><summary>${esc(r.name)} · Ver receta</summary><p><span class="pill">Ingredientes para ${prefs.people} persona(s)</span></p><ul>${r.ingredients.map(([a,q,u])=>`<li>${esc(a)}: ${Number((q*factor).toFixed(2))} ${esc(u)}</li>`).join('')}</ul><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="muted">Video: no disponible/verificado para esta receta.</p></details>`}
function dayCard(day,i,week,editable){return `<section class="card"><h3>${DAYS[i]}</h3>${MEALS.map(m=>`<div class="meal"><strong>${m}</strong>${esc(getRecipe(day[m]).name)} ${editable?`<div><button class="secondary" onclick="changeMeal(${i},'${m}')">Cambiar plato</button></div>`:''}${recipeHtml(day[m],true)}</div>`).join('')}</section>`}
function render(){let w=getWeek(selectedWeek);$('#nav').innerHTML=['Hoy','Semana','Mes','Recetas','Compras','Preferencias'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let html='';if(tab==='Hoy'){let now=new Date(),day=(now.getDay()+6)%7;let cw=getWeek(0);html=`<h2>Hoy · ${DAYS[day]}</h2><p class="muted">Tu menú del día. Tocá cada receta para ver ingredientes y pasos.</p>${!cw.approved?'<div class="notice">El menú de esta semana todavía no está aprobado. Podés revisarlo en «Semana».</div>':''}${dayCard(cw.days[day],day,cw,false)}`}
if(tab==='Semana'){html=`<div class="row"><h2>Menú semanal</h2><select aria-label="Elegir semana" onchange="selectedWeek=Number(this.value);render()">${[0,1,2,3,4].map(n=>`<option value="${n}" ${selectedWeek===n?'selected':''}>Semana ${n+1}</option>`).join('')}</select></div><p>${fmt(keyFor(selectedWeek))} · ${w.approved?'✅ Menú aprobado':'Borrador: revisá las recetas antes de aprobar'}</p><div class="row"><button class="secondary" onclick="regenerate()" ${w.approved?'disabled':''}>Generar otra propuesta</button><button class="primary" onclick="approve()" ${w.approved?'disabled':''}>${w.approved?'Aprobado':'Aprobar menú'}</button></div>${w.days.map((d,i)=>dayCard(d,i,w,!w.approved)).join('')}`}
if(tab==='Mes'){html='<h2>Plan mensual</h2><p>Organizá cinco semanas consecutivas. Los platos varían entre semanas.</p>'+[0,1,2,3,4].map(n=>{let x=getWeek(n);return `<div class="card row"><div><strong>Semana ${n+1}</strong><p class="muted">Desde el ${fmt(keyFor(n))} · ${x.approved?'Aprobada':'Pendiente'}</p></div><button class="secondary" onclick="selectedWeek=${n};go('Semana')">Ver menú</button></div>`}).join('')}
if(tab==='Recetas'){html='<h2>Recetario</h2><p>Podés consultar las recetas antes de aprobar un menú.</p>'+recipes.map(r=>`<div class="card">${recipeHtml(r.id)}</div>`).join('')}
if(tab==='Compras'){let approved=Object.entries(weeks).filter(([k,w])=>w.approved).sort(([a],[b])=>a.localeCompare(b));let selected=approved.find(([k])=>k===keyFor(selectedWeek))||approved[0];if(!selected)html='<h2>Lista de compras</h2><div class="notice">Primero aprobá un menú en la sección «Semana».</div>';else{let [k,x]=selected,items={};x.days.forEach(d=>MEALS.forEach(m=>{let r=getRecipe(d[m]);r.ingredients.forEach(([a,q,u])=>{let id=a+'|'+u;items[id]=(items[id]||0)+q*prefs.people/r.serv})}));html=`<h2>Compras</h2><p>Menú aprobado desde el ${fmt(k)} · ${prefs.people} persona(s)</p><button class="secondary" onclick="copyShopping()">Copiar lista</button><div class="card">${Object.entries(items).sort().map(([id,q])=>`<label><input type="checkbox"> ${esc(id.split('|')[0])}: ${Number(q.toFixed(2))} ${esc(id.split('|')[1])}</label>`).join('')}</div>`;window.shoppingText=Object.entries(items).sort().map(([id,q])=>`${id.split('|')[0]}: ${Number(q.toFixed(2))} ${id.split('|')[1]}`).join('\n')}}
if(tab==='Preferencias'){html=`<h2>Preferencias</h2><div class="card"><label>Personas por comida <input id="people" type="number" min="1" max="12" value="${prefs.people}"></label><p class="muted">Las cantidades de las recetas y compras se ajustan a este número.</p><button class="primary" onclick="setPeople()">Guardar</button></div><div class="card"><h3>Platos que prefiero evitar</h3>${recipes.map(r=>`<label><input type="checkbox" ${prefs.avoid.includes(r.id)?'checked':''} onchange="toggleAvoid('${r.id}',this.checked)"> ${esc(r.name)}</label>`).join('')}</div><div class="notice">Esta versión funciona sin servidor y guarda las elecciones en este dispositivo. Los menús son propuestas orientativas: no verifican automáticamente estacionalidad, nutrientes ni disponibilidad de ingredientes.</div>`}
$('#app').innerHTML=html}
window.go=t=>{tab=t;render();window.scrollTo(0,0)};window.changeMeal=(i,m)=>{let w=getWeek(selectedWeek);if(w.approved)return;let options=pools[m].filter(id=>!prefs.avoid.includes(id));if(!options.length)options=pools[m];let at=options.indexOf(w.days[i][m]);w.days[i][m]=options[(at+1)%options.length];weeks[keyFor(selectedWeek)]=w;save();render()};window.approve=()=>{let w=getWeek(selectedWeek);w.approved=true;weeks[keyFor(selectedWeek)]=w;save();render()};window.regenerate=()=>{let k=keyFor(selectedWeek);if(getWeek(selectedWeek).approved)return;let w=getWeek(selectedWeek);w.days.forEach((d,i)=>MEALS.forEach(m=>{let a=pools[m].filter(id=>!prefs.avoid.includes(id));if(a.length)d[m]=a[(a.indexOf(d[m])+1+a.length)%a.length]}));weeks[k]=w;save();render()};window.setPeople=()=>{prefs.people=Math.max(1,Math.min(12,Number($('#people').value)||2));save();render()};window.toggleAvoid=(id,on)=>{prefs.avoid=on?[...new Set([...prefs.avoid,id])]:prefs.avoid.filter(x=>x!==id);save()};window.copyShopping=()=>{if(navigator.clipboard)navigator.clipboard.writeText(window.shoppingText).then(()=>alert('Lista copiada')).catch(()=>prompt('Copiá la lista:',window.shoppingText));else prompt('Copiá la lista:',window.shoppingText)};render();
</script><script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }</script></body></html>
